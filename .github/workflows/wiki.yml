name: Sync Docs to Wiki

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'docs/**'
      - 'README.md'

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    # Need write permissions to push to the wiki
    permissions:
      contents: write
      
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        path: source

    - name: Checkout Wiki
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}.wiki
        path: wiki

    - name: Copy Docs and Push to Wiki
      run: |
        # Use rsync to perfectly mirror the docs folder into the wiki
        # This copies all files (including hidden ones, subdirectories, non-md files)
        # and removes files in the wiki that no longer exist in docs,
        # while explicitly preserving the .git folder.
        rsync -av --delete --exclude='.git' source/docs/ wiki/
        
        # Optional: if you want the main README to be the Wiki home page:
        # cp source/README.md wiki/Home.md
        
        cd wiki
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        git add .
        
        # Check if there are any changes to commit
        if ! git diff-index --quiet HEAD; then
          git commit -m "docs: sync wiki with docs folder [skip ci]"
          git push
        else
          echo "No changes to commit to the wiki."
        fi
