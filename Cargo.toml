[package]
name = "savetensor-disksort"
version = "0.1.0"
edition = "2021"
authors = ["SaveTensor DiskSort Team"]
description = "Multi-drive AI model file inventory, planning, and relocation tool"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "string"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
blake3 = { version = "1.5", features = ["mmap", "rayon"] }
memmap2 = "0.9"
walkdir = "2.5"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.16"

[[bin]]
name = "disksort"
path = "src/main.rs"

[lib]
name = "savetensor_disksort"
path = "src/lib.rs"
